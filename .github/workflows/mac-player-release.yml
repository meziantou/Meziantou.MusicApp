name: Build and release macOS player

on:
  push:
    tags:
      - "macos-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example macos-v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Publish as prerelease"
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
      APP_NAME: Meziantou Music
      ARCHIVE_NAME: MeziantouMusic
    defaults:
      run:
        working-directory: Meziantou.MusicApp.MacPlayer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run tests
        run: swift test

      - name: Build release app
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#macos-v}"
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_TAG must match macos-v<major>.<minor>.<patch>, got: $RELEASE_TAG"
            exit 1
          fi

          APP_VERSION="$RELEASE_VERSION" APP_BUILD="$GITHUB_RUN_NUMBER" Scripts/build-app.sh release
          echo "APP_PATH=$PWD/.build/$APP_NAME.app" >> "$GITHUB_ENV"

      - name: Sign app bundle
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [ -n "${MACOS_CERT_P12_BASE64:-}" ] && [ -n "${MACOS_CERT_P12_PASSWORD:-}" ] && [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"

            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH" 2>/dev/null || echo "$MACOS_CERT_P12_BASE64" | base64 -D > "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security default-keychain -s "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          else
            echo "Developer ID signing secrets are not configured, using ad-hoc signing."
            codesign --force --deep --sign - "$APP_PATH"
          fi

          xattr -cr "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app (optional)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            echo "Notarization secrets are not configured, skipping notarization."
            exit 0
          fi

          NOTARY_ZIP="$RUNNER_TEMP/$ARCHIVE_NAME-for-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"

          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple "$APP_PATH"

      - name: Package app
        run: |
          set -euo pipefail
          mkdir -p dist
          PACKAGE_DIR="$RUNNER_TEMP/$ARCHIVE_NAME"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          ditto "$APP_PATH" "$PACKAGE_DIR/$APP_NAME.app"

          # Helper for unsigned (ad-hoc) builds: removes the quarantine flag and opens the app
          HELPER_SCRIPT_PATH="$PACKAGE_DIR/Open-$ARCHIVE_NAME.command"
          cat > "$HELPER_SCRIPT_PATH" <<EOF
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="\$(cd "\$(dirname "\$0")" && pwd)"
          APP_PATH="\$SCRIPT_DIR/$APP_NAME.app"
          xattr -dr com.apple.quarantine "\$APP_PATH" || true
          open "\$APP_PATH"
          EOF
          chmod +x "$HELPER_SCRIPT_PATH"

          ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_DIR" "dist/$ARCHIVE_NAME-$RELEASE_TAG.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARCHIVE_NAME }}-${{ env.RELEASE_TAG }}
          path: Meziantou.MusicApp.MacPlayer/dist/*
          if-no-files-found: error
          retention-days: 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Meziantou Music for macOS ${{ env.RELEASE_TAG }}
          body: |
            Native macOS player for the Meziantou Music Server (macOS 15 or later).

            ## Installation

            1. Download and unzip `${{ env.ARCHIVE_NAME }}-${{ env.RELEASE_TAG }}.zip`.
            2. Move `${{ env.APP_NAME }}.app` to your **Applications** folder.
            3. Remove the quarantine flag, then open the app:
               ```sh
               xattr -dr com.apple.quarantine "/Applications/${{ env.APP_NAME }}.app"
               open "/Applications/${{ env.APP_NAME }}.app"
               ```
               Alternatively, double-click the included **`Open-${{ env.ARCHIVE_NAME }}.command`** script — it removes the quarantine flag and launches the app automatically.
          generate_release_notes: true
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          files: Meziantou.MusicApp.MacPlayer/dist/*
