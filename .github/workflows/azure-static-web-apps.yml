name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Meziantou.MusicApp.WebPlayer/**'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:      
      - run: echo ::add-mask::${{ secrets.PLAYERURL }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: Meziantou.MusicApp.WebPlayer/package-lock.json

      - name: Install dependencies
        working-directory: Meziantou.MusicApp.WebPlayer
        run: npm ci

      - name: Run tests
        working-directory: Meziantou.MusicApp.WebPlayer
        run: npm test

      - name: Build Application
        working-directory: Meziantou.MusicApp.WebPlayer
        run: npm run build
        env:
          VITE_COMMIT_HASH: ${{ github.sha }}

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Meziantou.MusicApp.WebPlayer/dist"
          output_location: ""
          skip_app_build: true
